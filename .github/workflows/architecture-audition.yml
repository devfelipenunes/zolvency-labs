name: R65 architecture and material audition
on:
  pull_request:
    branches: [research/r65-kinetic-architecture, main]
    paths: ['src/graphics/glyph*.js','src/graphics/spatialNarrativeText.js','scripts/architecture-check.mjs','tests/glyphMatching.test.js','.github/workflows/architecture-audition.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [mineral, titanium, green, native-touch]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install Chromium and verify launch
        run: |
          npx playwright install chromium
          if ! node --input-type=module -e "import {chromium} from 'playwright';const b=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});await b.close()"; then
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources /etc/apt/sources.list.d/azure-cli.list
            sudo apt-get -o Acquire::Retries=3 update
            npx playwright install-deps chromium
          fi
      - if: matrix.variant != 'native-touch'
        run: TYPE_WIDTH=390 TYPE_FINISH=${{ matrix.variant }} node scripts/architecture-check.mjs
      - if: matrix.variant == 'native-touch'
        run: TOUCH_QUERY='/?living-type=architecture' TOUCH_OUT=artifacts/glyphs node scripts/touch-guide-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: architecture-${{ matrix.variant }}
          path: artifacts/glyphs/
