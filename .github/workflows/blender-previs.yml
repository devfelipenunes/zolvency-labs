name: Blender spatial typography previs
on:
  pull_request:
    branches: [feat/v0.31-editorial-direction]
    paths: ['scripts/*blender*','src/graphics/threeScene.js','.github/workflows/blender-previs.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: blender-previs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/export-blender-previs.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blender-input
          path: artifacts/blender-input/
  render:
    needs: export
    if: always() && (needs.export.result == 'success' || needs.export.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["office","quantum","stellar"]' || '["quantum"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.event_name == 'workflow_dispatch'
        with:
          name: blender-input
          path: artifacts/blender-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.event_name != 'workflow_dispatch'
        with:
          name: blender-input
          path: artifacts/blender-input
          github-token: ${{ github.token }}
          run-id: 45892011208
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends blender
      - run: blender --version
      - run: blender -b -t 4 --python-exit-code 1 --python scripts/blender-spatial-previs.py -- artifacts/blender-input artifacts/blender-previs ${{ matrix.scene }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: blender-previs-${{ matrix.scene }}
          path: artifacts/blender-previs/
