name: Bundle verified facility models (one-time)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  bundle:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/self-contained-facility'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/self-contained-facility
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch exact pinned bytes using normal HTTPS
        run: FACILITY_SOURCE=upstream node scripts/stage-facility.mjs
      - name: Materialize and independently verify all pinned files
        run: |
          node --input-type=module <<'JS'
          import {readFile,mkdir,copyFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const {assets}=JSON.parse(await readFile('public/models/manifest.json','utf8'));
          await mkdir('assets/vendor/facility',{recursive:true});
          let bytes=0;
          for(const f of assets){
            const src='public/models/facility/'+f.file,b=await readFile(src);
            if(b.length!==f.bytes||createHash('sha256').update(b).digest('hex')!==f.sha256)throw Error(f.file);
            await copyFile(src,'assets/vendor/facility/'+f.file);
            bytes+=b.length;
          }
          console.log(assets.length+' verified assets; '+bytes+' bytes');
          JS
          rm -rf public/models .cache/facility
          node scripts/stage-facility.mjs
          node --test tests/facilityAssets.test.js
      - name: Commit only verified asset files to dedicated branch
        run: |
          git add -- assets/vendor/facility/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Vendor exact verified facility models for offline development'
          git push origin HEAD:refs/heads/fix/self-contained-facility
