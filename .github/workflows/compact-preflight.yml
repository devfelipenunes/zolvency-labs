name: Compact preflight comparison
on:
  pull_request:
    branches: [main, feat/v0.31-directed-experience, feat/v0.31-responsive-cinematic]
    paths:
      - 'src/graphics/compactPreflight.js'
      - 'scripts/compact-preflight-check.mjs'
      - '.github/workflows/compact-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compact-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        view: [desktop, mobile]
    env:
      PREFLIGHT_VIEW: ${{ matrix.view }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/compact-preflight-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compact-preflight-${{ matrix.view }}
          path: artifacts/compact-preflight/
