name: Editorial direction audition
on:
  pull_request:
    branches: [feat/v0.31-directed-experience, main]
    paths: ['src/**', 'scripts/editorial-*.mjs', 'tests/editorialDirection.test.js', '.github/workflows/editorial-direction.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editorial-direction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
  audition:
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        view: [desktop, mobile]
        edition: [control, manifesto, precision, exploration]
    env:
      COPY_VIEW: ${{ matrix.view }}
      COPY_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/editorial-direction-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: editorial-${{ matrix.edition }}-${{ matrix.view }}
          path: artifacts/editorial-audition/
  native-scroll:
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        view: [desktop, mobile]
    env:
      EDITORIAL_INTEGRATED: '1'
      EDITORIAL_DIRECTION: staged
      EDITORIAL_TRAVEL: responsive
      EDITORIAL_PROFILE: economy
      EDITORIAL_COPY: manifesto
      EDITORIAL_VIEW: ${{ matrix.view }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/editorial-experience-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: editorial-native-${{ matrix.view }}
          path: artifacts/integrated-cinematic/
