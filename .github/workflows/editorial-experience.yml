name: Editorial motion and performance
on:
  pull_request:
    branches: [main, chore/verified-backlog-reconciliation]
    paths:
      - 'src/**'
      - 'tests/editorialExperience.test.js'
      - 'scripts/editorial-experience-check.mjs'
      - '.github/workflows/editorial-experience.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editorial-experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {view: desktop, profile: legacy}
          - {view: desktop, profile: balanced}
          - {view: desktop, profile: economy}
          - {view: desktop, profile: cinematic}
          - {view: mobile, profile: legacy}
          - {view: mobile, profile: economy}
    env:
      EDITORIAL_VIEW: ${{ matrix.view }}
      EDITORIAL_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/editorial-experience-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: editorial-${{ matrix.view }}-${{ matrix.profile }}
          path: artifacts/editorial-experience/
