name: Operations lighting isolation A-B
on:
  pull_request:
    branches: [feat/v0.31-directed-experience]
    paths: ['src/graphics/subjectLighting.js','scripts/subject-lighting-check.mjs','tests/subjectLighting.test.js','.github/workflows/ops-light-isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        view: [desktop, mobile]
    env:
      LIGHT_VIEW: ${{ matrix.view }}
      LIGHT_FOCUS: ops
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/subjectLighting.test.js
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/subject-lighting-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ops-light-${{ matrix.view }}
          path: artifacts/subject-lighting/
