name: Photographic realism review
on:
  pull_request:
    branches: [main, feat/v0.29-evidence-complete]
    paths:
      - 'src/graphics/photographicRealism.js'
      - 'src/graphics/threeScene.js'
      - 'scripts/visual-review*.mjs'
      - 'tests/photographicRealism.test.js'
      - '.github/workflows/photographic-realism.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photographic-realism-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        view: [desktop, mobile]
    env:
      REVIEW_VIEW: ${{ matrix.view }}
      REVIEW_GROUP: realism
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/visual-review.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: photographic-realism-${{ matrix.view }}
          path: artifacts/visual-review/
          if-no-files-found: warn
