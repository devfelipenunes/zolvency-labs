name: Progressive loading regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/progressive-loading-check.mjs'
      - 'src/graphics/threeScene.js'
      - 'src/graphics/facilityLayout.js'
      - '.github/workflows/progressive-loading.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/progressive-loading-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: progressive-loading
          path: artifacts/progressive-loading/
