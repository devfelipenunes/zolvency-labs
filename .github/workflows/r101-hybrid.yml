name: Hybrid experience foundation
on:
  pull_request:
    branches: [preview/r99-11-14-spatial-continuity, preview/r99-4-9-continuity, preview/r99-continuous-cinematic-handoff, preview/r96-r97-editorial-identity, preview/r95-r101-hybrid-foundation, preview/r94-immersive-roadmap, preview/r88-integrated-candidate, main]
    paths: ['src/experience/**','src/App.jsx','src/useScrollStory.js','tests/r95-facility-range.test.js','tests/r102-mandate-policy.test.js','scripts/r101-hybrid-check.mjs','.github/workflows/r101-hybrid.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hybrid:
    strategy:
      fail-fast: false
      matrix:
        include:
          - live: '0'
            width: 'all'
          - live: '1'
            width: '390'
          - live: '1'
            width: '1280'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/r101-hybrid-check.mjs
        env:
          HYBRID_LIVE: ${{ matrix.live }}
          HYBRID_LIVE_WIDTH: ${{ matrix.width }}
      - run: node scripts/r106-editorial-budget.mjs
        if: matrix.live == '0'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hybrid-handoff-${{ matrix.width }}
          path: |
            artifacts/hybrid/
            artifacts/editorial-budget/
