name: Hybrid reading and device readiness
on:
  pull_request:
    branches: [preview/r95-r101-hybrid-foundation, preview/r94-immersive-roadmap, preview/r88-integrated-candidate, main]
    paths: ['src/DeviceCapture.jsx','src/App.jsx','src/experience/**','scripts/r105-hybrid-device-readiness.mjs','.github/workflows/r105-hybrid-device-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/r105-hybrid-device-readiness.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hybrid-device-readiness
          path: artifacts/hybrid-device-readiness/
