name: Threshold network and visual comparison
on:
  pull_request:
    branches: [preview/r111-idle-opening-prefetch, preview/r95-r101-hybrid-foundation]
    paths: ['src/experience/**','src/App.jsx','src/graphics/**','scripts/r114-r115-threshold-comparison.mjs','.github/workflows/r114-r115-threshold-comparison.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    strategy:
      fail-fast: false
      matrix:
        variant: [control, candidate]
        network: [local, limited]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/r114-r115-threshold-comparison.mjs
        env:
          THRESHOLD_VARIANT: ${{ matrix.variant }}
          THRESHOLD_NETWORK: ${{ matrix.network }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: threshold-${{ matrix.variant }}-${{ matrix.network }}
          path: artifacts/threshold-comparison/
