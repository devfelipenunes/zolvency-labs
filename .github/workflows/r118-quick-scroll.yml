name: Rapid cold scroll diagnostic
on:
  pull_request:
    branches: [preview/r117-cinematic-entry]
    paths: ['scripts/r118-quick-scroll-probe.mjs','.github/workflows/r118-quick-scroll.yml']
permissions:
  contents: read
jobs:
  quick:
    strategy:
      fail-fast: false
      matrix:
        network: [local, limited]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/r118-quick-scroll-probe.mjs
        env:
          QUICK_NETWORK: ${{ matrix.network }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quick-scroll-${{ matrix.network }}
          path: artifacts/quick-scroll/
