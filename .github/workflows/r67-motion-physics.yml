name: R67 F03 F04 motion and physics
on:
  pull_request:
    branches: [preview/r66-art-direction-selected, main]
    paths: ['src/graphics/r67/motion-physics*','scripts/r67-motion-physics*','tests/r67-motion-physics*','.github/workflows/r67-motion-physics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/r67-motion-physics.test.js
      - run: node scripts/r67-motion-physics.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r67-motion-physics
          path: artifacts/r67-physics/
