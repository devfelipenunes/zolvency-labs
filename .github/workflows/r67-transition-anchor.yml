name: R67 F05 F06 transition and anchor
on:
  pull_request:
    branches: [preview/r66-art-direction-selected, main]
    paths: ['src/graphics/r67/transition-anchor*','scripts/r67-transition-anchor*','tests/r67-transition-anchor*','.github/workflows/r67-transition-anchor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/r67-transition-anchor.test.js
      - run: node scripts/r67-transition-anchor.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r67-transition-anchor
          path: artifacts/r67-transition/
