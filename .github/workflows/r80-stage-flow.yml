name: R80 stage handoff, directional letter exits and entrances
on:
  pull_request:
    branches: [preview/r79-cinematic-type, main]
    paths: ['src/graphics/**','scripts/r80-stage-flow.mjs','.github/workflows/r80-stage-flow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [portrait-390, portrait-320, desktop-1280, native-touch]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install Chromium and verify launch
        run: |
          npx playwright install chromium
          if ! node --input-type=module -e "import {chromium} from 'playwright';const b=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});await b.close()"; then
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources /etc/apt/sources.list.d/azure-cli.list
            sudo apt-get -o Acquire::Retries=3 update
            npx playwright install-deps chromium
          fi
      - if: matrix.variant != 'native-touch'
        run: TYPE_WIDTH=${{ matrix.variant == 'portrait-320' && '320' || matrix.variant == 'desktop-1280' && '1280' || '390' }} TYPE_FINISH=mineral node scripts/r80-stage-flow.mjs
      - if: matrix.variant == 'native-touch'
        run: TOUCH_QUERY='/?living-type=kinetic&type-formation=ribbon&type-layout=directed&type-visibility=continuous&type-choreography=stage-flow' TOUCH_OUT=artifacts/glyphs node scripts/touch-guide-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r80-stage-flow-${{ matrix.variant }}
          path: artifacts/
