name: R91 version A glyph delta equivalence
on:
  pull_request:
    branches: [preview/r80-stage-handoff, preview/r81-scene-presence, preview/r83-organic-motion, preview/r88-integrated-candidate, preview/r90-version-a-pacing, main]
    paths: ['src/App.jsx','src/graphics/**','test/**','tests/**','scripts/r85-camera-audit.mjs','scripts/r87-compare-revisions.mjs','scripts/r81-scene-presence.mjs','.github/workflows/r81-scene-presence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [portrait-390, portrait-320, desktop-1280, native-touch]
        glyph: [control, glyph-delta]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install Chromium and verify launch
        run: |
          npx playwright install chromium
          if ! node --input-type=module -e "import {chromium} from 'playwright';const b=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});await b.close()"; then
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources /etc/apt/sources.list.d/azure-cli.list
            sudo apt-get -o Acquire::Retries=3 update
            npx playwright install-deps chromium
          fi
      - if: matrix.variant != 'native-touch'
        run: TYPE_WIDTH=${{ matrix.variant == 'portrait-320' && '320' || matrix.variant == 'desktop-1280' && '1280' || '390' }} TYPE_QUERY_SUFFIX='&type-spatial=control&type-pacing=cinematic-a&type-perf=${{ matrix.glyph }}' TYPE_FINISH=mineral node scripts/r81-scene-presence.mjs
      - if: matrix.variant == 'native-touch'
        run: TOUCH_QUERY='/?living-type=kinetic&type-formation=ribbon&type-layout=directed&type-visibility=continuous&type-choreography=scene-presence&type-spatial=control&type-pacing=cinematic-a&type-perf=${{ matrix.glyph }}' TOUCH_OUT=artifacts/glyphs node scripts/touch-guide-check.mjs
      - name: Analyze camera trajectory evidence
        if: always() && matrix.variant != 'native-touch'
        run: |
          if [ -f artifacts/r81-scene-presence/report.json ]; then
            node scripts/r85-camera-audit.mjs artifacts/r81-scene-presence/report.json artifacts/r81-scene-presence/camera-audit.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r91-${{ matrix.glyph }}-${{ matrix.variant }}
          path: artifacts/
