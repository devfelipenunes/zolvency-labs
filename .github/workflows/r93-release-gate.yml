name: R93 release evidence gate
on:
  pull_request:
    branches: [preview/r88-integrated-candidate, main]
    paths: ['scripts/r93-release-gate.mjs','tests/r93-release-gate.test.js','.github/workflows/r93-release-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/r93-release-gate.test.js
