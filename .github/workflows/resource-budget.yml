name: Resource and shadow budgets
on:
  pull_request:
    branches: [feat/v0.31-runtime-performance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
  compare:
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        include:
          - {view: desktop, variant: live}
          - {view: mobile, variant: live}
          - {view: desktop, variant: shadow}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEVICE_VIEW: ${{ matrix.view }}
      DEVICE_SOFTWARE: '1'
      RESOURCE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/resource-budget-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resource-${{ matrix.variant }}-${{ matrix.view }}
          path: artifacts/resource-budget/
