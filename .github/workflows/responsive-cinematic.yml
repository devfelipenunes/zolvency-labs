name: Responsive cinematic comparison
on:
  pull_request:
    branches: [main, feat/v0.31-directed-experience]
    paths:
      - 'src/graphics/travelMotion.js'
      - 'src/graphics/cameraPacing.js'
      - 'scripts/prepare-pacing.mjs'
      - 'scripts/responsive-cinematic-check.mjs'
      - '.github/workflows/responsive-cinematic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        view: [desktop, mobile]
    env:
      DEVICE_SOFTWARE: '1'
      DEVICE_VIEW: ${{ matrix.view }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/responsive-cinematic-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: responsive-cinematic-${{ matrix.view }}
          path: artifacts/responsive-cinematic/
