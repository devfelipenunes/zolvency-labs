name: Responsive composition study
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/graphics/**'
      - 'scripts/visual-review*.mjs'
      - '.github/workflows/responsive-study.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: responsive-study-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {view: mobile, width: 360, height: 800}
          - {view: mobile, width: 390, height: 844}
          - {view: mobile, width: 430, height: 932}
          - {view: desktop, width: 740, height: 390}
    env:
      REVIEW_VIEW: ${{ matrix.view }}
      REVIEW_WIDTH: ${{ matrix.width }}
      REVIEW_HEIGHT: ${{ matrix.height }}
      REVIEW_GROUP: responsive
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/visual-review.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: responsive-${{ matrix.width }}x${{ matrix.height }}
          path: artifacts/visual-review/
