name: Actual geometry typography surface map
on:
  pull_request:
    branches: [main]
    paths: ['src/graphics/surfaceSeeds.js','scripts/surface-map-check.mjs','tests/surfaceSeeds.test.js','.github/workflows/surface-map.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        view: [desktop, mobile]
    env:
      SURFACE_VIEW: ${{ matrix.view }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install Chromium with bounded retry
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 15))"; fi
          done
          exit 1
      - run: node scripts/surface-map-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: surface-map-${{ matrix.view }}
          path: artifacts/surface-map/
