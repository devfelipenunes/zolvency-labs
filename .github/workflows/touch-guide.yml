name: Mobile touch ownership and release
on:
  pull_request:
    branches: [preview/v0.32-mobile-gpu-ab, main]
    paths: ['src/graphics/touchGuidedMotion.js','scripts/touch-guide-check.mjs','tests/touchGuidedMotion.test.js','.github/workflows/touch-guide.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gesture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/touch-guide-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: touch-guide
          path: artifacts/touch-guide/
