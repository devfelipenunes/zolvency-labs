name: Typography SDF MSDF HTML audition
on:
  pull_request:
    branches: [main, chore/verified-backlog-reconciliation]
    paths:
      - 'scripts/typography-*'
      - '.github/workflows/typography-audition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund msdf-bmfont-xml@2.8.0
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core
      - run: node scripts/typography-atlas.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/typography-audition.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: typography-audition
          path: artifacts/typography-audition/
