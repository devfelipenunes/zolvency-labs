name: Cinematic visual review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/graphics/**'
      - 'src/App.jsx'
      - 'src/story.js'
      - 'src/styles.css'
      - 'scripts/visual-review-plan.mjs'
      - 'scripts/visual-review.mjs'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        view: [desktop, mobile]
        group: [plates, variants, narrative, motion, effects]
        exclude:
          - view: mobile
            group: effects
    env:
      REVIEW_VIEW: ${{ matrix.view }}
      REVIEW_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/visual-review.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cinematic-review-${{ matrix.view }}-${{ matrix.group }}
          path: artifacts/visual-review/
          if-no-files-found: warn
